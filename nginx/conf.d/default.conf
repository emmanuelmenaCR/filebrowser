upstream filebrowser_backend {
    server filebrowser:80;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Allow unlimited file upload sizes
    client_max_body_size 0;

    # Disable buffering to allow direct streaming of uploads and downloads
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;

    # Extended timeouts for large file transfers (1 hour)
    proxy_connect_timeout 300s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    send_timeout 3600s;

    # Proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # 1. Rate limiting on login (Anti Brute-Force)
    # Allows a burst of up to 3 requests with no delay, strictly limited to 5 requests/min
    location = /api/login {
        limit_req zone=login_limit burst=3 nodelay;
        proxy_pass http://filebrowser_backend;
    }

    # 2. Rate limiting on search (Anti Disk I/O DoS)
    location = /api/search {
        limit_req zone=search_limit burst=5 nodelay;
        proxy_pass http://filebrowser_backend;
    }

    # 3. All other resources and web interface
    location / {
        limit_req zone=general_limit burst=50 nodelay;
        proxy_pass http://filebrowser_backend;
    }
}

