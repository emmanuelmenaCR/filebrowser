user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Rate limiting zones:
    # 1. Login rate limit: 5 requests per minute per IP (protects /api/login from brute-force)
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

    # 2. Search rate limit: 10 requests per minute per IP (prevents disk I/O DoS attacks)
    limit_req_zone $binary_remote_addr zone=search_limit:10m rate=10r/m;

    # 3. General rate limit: 50 requests per second per IP (standard browsing)
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=50r/s;

    # Return HTTP 429 Too Many Requests when rate limit is exceeded
    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}
